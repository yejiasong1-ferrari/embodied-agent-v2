<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">V2 closed-loop manipulation pipeline</title>
  <desc id="desc">Five stages: interpret, observe, model, act, verify. Uncertain or failed steps return to observation and replanning within a bounded retry budget.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#101b29"/>
      <stop offset="1" stop-color="#091018"/>
    </linearGradient>
    <linearGradient id="card" x2="0" y2="1">
      <stop offset="0" stop-color="#192b3a"/>
      <stop offset="1" stop-color="#11202d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#72bdf3" stroke-width="1.5"/>
    </marker>
    <marker id="retry-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#f0c674" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect x="25" y="24" width="1150" height="472" rx="22" fill="none" stroke="#315069" opacity=".55"/>
  <text x="58" y="74" fill="#eff7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">From instruction to checked outcome</text>
  <text x="59" y="110" fill="#a7bdce" font-family="Arial, sans-serif" font-size="21">The robot observes again when evidence is weak or a physical action fails.</text>

  <g fill="url(#card)" stroke="#45657c" stroke-width="1.5">
    <rect x="50" y="158" width="180" height="197" rx="17"/>
    <rect x="280" y="158" width="180" height="197" rx="17"/>
    <rect x="510" y="158" width="180" height="197" rx="17"/>
    <rect x="740" y="158" width="180" height="197" rx="17"/>
    <rect x="970" y="158" width="180" height="197" rx="17"/>
  </g>
  <g fill="#72bdf3" font-family="Arial, sans-serif" font-size="18" font-weight="700">
    <text x="70" y="190">01 / GOAL</text><text x="300" y="190">02 / CAMERA</text><text x="530" y="190">03 / MEMORY</text><text x="760" y="190">04 / ROBOT</text><text x="990" y="190">05 / CHECK</text>
  </g>
  <g fill="#f2f7fb" font-family="Arial, sans-serif" font-size="25" font-weight="700">
    <text x="70" y="229">Interpret</text><text x="300" y="229">Observe</text><text x="530" y="229">Model</text><text x="760" y="229">Act</text><text x="990" y="229">Verify</text>
  </g>
  <g fill="#b9cad7" font-family="Arial, sans-serif" font-size="18">
    <text x="70" y="265"><tspan x="70" dy="0">Which object?</tspan><tspan x="70" dy="26">Which relation?</tspan></text>
    <text x="300" y="265"><tspan x="300" dy="0">Wrist RGB-D</tspan><tspan x="300" dy="26">+ new viewpoints</tspan></text>
    <text x="530" y="265"><tspan x="530" dy="0">3D estimates</tspan><tspan x="530" dy="26">+ uncertainty</tspan></text>
    <text x="760" y="265"><tspan x="760" dy="0">Grasp, lift,</tspan><tspan x="760" dy="26">move, release</tspan></text>
    <text x="990" y="265"><tspan x="990" dy="0">Fresh relation</tspan><tspan x="990" dy="26">+ stability</tspan></text>
  </g>
  <g stroke="#72bdf3" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M240 253H268"/><path d="M470 253H498"/><path d="M700 253H728"/><path d="M930 253H958"/>
  </g>
  <rect x="985" y="314" width="150" height="27" rx="13" fill="#1d5b4c"/>
  <text x="1060" y="333" text-anchor="middle" fill="#bbf7de" font-family="Arial, sans-serif" font-size="16" font-weight="700">only if accepted</text>
  <path d="M1060 367V435H370V367" fill="none" stroke="#f0c674" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#retry-arrow)"/>
  <rect x="424" y="405" width="573" height="57" rx="13" fill="#172431" stroke="#7f6843"/>
  <text x="710" y="440" text-anchor="middle" fill="#f3d99b" font-family="Arial, sans-serif" font-size="20" font-weight="600">Uncertain or failed? Reobserve and replan within a limit.</text>
</svg>
